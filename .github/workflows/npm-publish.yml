# Publish this NodeBB plugin to the public npm registry whenever a GitHub
# Release is created.
#
# Required repository secret:
#   NPM_TOKEN - must be a token that can bypass 2FA, otherwise npm rejects the
#               publish with:
#                 E403 ... Two-factor authentication or granular access token
#                 with bypass 2fa enabled is required to publish packages.
#               Use either:
#                 * Classic token, type "Automation" (bypasses 2FA), or
#                 * Granular token with "Read and write" packages access AND
#                   "Bypass 2FA" enabled.
#               Create at: https://www.npmjs.com/settings/~/tokens
#
# Release flow:
#   1. Bump "version" in package.json (e.g. 2.0.3 -> 2.0.4) and commit.
#   2. Create a GitHub Release whose tag matches that version, e.g. v2.0.4.
#   3. This workflow verifies tag == package.json version, then runs `npm publish`.

name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Guard: the release tag must match package.json's version, so we never
      # publish a build whose tag and version disagree.
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          echo "package.json: $PKG_VERSION   release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch - bump package.json to ${TAG#v} before releasing."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
